<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script defer src="app.js"></script>
    <link rel="stylesheet" href="styles.css" />
    <title>API</title>
  </head>
  <body>
    <header>
      <h1>Ørjans TV Show Database <span class="imdb_font">ØTDb</span></h1>
      <div class="search_container">
        <h3>Søk etter en film</h3>
        <search>
          <input
            class="search"
            type="search"
            name="q"
            id="search"
            placeholder="F.eks Friends..."
            aria-label="search https://api.tvmaze.com for content"
          />

          <button
            type="button"
            class="search_btn"
            id="searchButton"
            name="search"
          >
            SØK
          </button>
        </search>
      </div>
      <button id="surpriseBtn">Surprise Me!</button>
    </header>
    <main id="tvShowContainer"></main>
  </body>
</html>
